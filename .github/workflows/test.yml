name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly, so every main branch has a verdict under a week old (a Dependabot
  # token merge fires no push run), read by Monday's maintenance pass.
  schedule:
    - cron: "44 14 * * 0"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # This fork uses PEP 735 [dependency-groups] (not a
        # [project.optional-dependencies] extra), so the group installs via
        # `--group dev`, not `.[dev]`. Upgrading pip first guarantees a version
        # that supports --group (>= 25.1).
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      # Ruff is intentionally NOT gated here. This is a fork of
      # zw008/VMware-AIops and inherits upstream style the repo's own ruff
      # config would flag (~180 findings: Optional[X] over PEP 604 in tool
      # signatures, etc.) — style debt that predates our changes and carries no
      # signal about them. The test suite is the meaningful gate; a ruff cleanup,
      # if ever wanted, is a separate pass. (Our own added files were linted
      # clean at authoring time.)
      - name: Run tests
        # Under GITHUB_ACTIONS, Rich forces terminal rendering and bolds each dash
        # of an option name separately, so a CLI error saying "--user" never
        # contains that literal string and the guest-username tests fail in CI
        # only. Typer's switch renders plain text, as on a developer machine.
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: python -m pytest tests/
